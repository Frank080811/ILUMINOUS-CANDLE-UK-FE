<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Confirmed | Luminous Candles</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    /* ==================== SUCCESS PAGE ==================== */
    body {
      background: linear-gradient(135deg, #0e0e11 0%, #1a1a1f 100%);
      color: #f5f5f5;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }

    .success-wrapper {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
      text-align: center;
    }

    .success-message h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #ffb703;
      margin-bottom: 12px;
    }

    .checkmark {
      font-size: 70px;
      color: #ffb703;
      margin-bottom: 20px;
    }

    .summary {
      background: rgba(255,255,255,0.04);
      border-radius: 16px;
      padding: 30px;
      width: min(800px, 95%);
      text-align: left;
    }

    table {
      width: 100%;
      margin-top: 15px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      font-size: 0.9rem;
    }

    th {
      background: #111;
      color: #ffb703;
    }

    .totals td {
      font-weight: bold;
      color: #ffb703;
    }

    .btn-back {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      background: #ffb703;
      color: #111;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
    }

    .pending {
      color: #ffb703;
      font-weight: bold;
      margin-top: 20px;
    }

    .error {
      color: #ff6b6b;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>

<body class="success-page">

<header class="header">
  <div class="container nav-container">
    <div class="logo">
      <a href="index.html"><img src="images/logo.png"></a>
    </div>
  </div>
</header>

<div class="success-wrapper">
  <div class="checkmark">✔️</div>

  <div class="success-message">
    <h1>Thank You for Your Purchase!</h1>
    <p id="statusText" class="pending">Confirming your payment…</p>
  </div>

  <div id="orderDetails"></div>
</div>

<script>
const API_URL = "https://iluminous-candle-uk-be.onrender.com";
const orderId = localStorage.getItem("lumina_last_order_id");
const statusText = document.getElementById("statusText");
const detailsDiv = document.getElementById("orderDetails");

if (!orderId) {
  statusText.textContent = "⚠️ Order reference missing.";
  statusText.className = "error";
}

/* ================== POLL ORDER STATUS ================== */
async function pollOrder() {
  for (let attempt = 0; attempt < 12; attempt++) {
    try {
      const res = await fetch(`${API_URL}/order/${orderId}`);
      if (!res.ok) throw new Error();

      const data = await res.json();

      if (data.order.status === "PAID") {
        renderOrder(data);
        localStorage.removeItem("lumina_cart");
        return;
      }
    } catch {}

    await new Promise(r => setTimeout(r, 1500));
  }

  statusText.textContent = "Payment is still processing. Please refresh shortly.";
}

/* ================== RENDER ORDER ================== */
function renderOrder(data) {
  statusText.textContent = "Payment confirmed 🎉";

  const rows = data.items.map(i => `
    <tr>
      <td>${i.product_name}</td>
      <td>${i.quantity}</td>
      <td>£${i.price.toFixed(2)}</td>
      <td>£${(i.price * i.quantity).toFixed(2)}</td>
    </tr>
  `).join("");

  detailsDiv.innerHTML = `
    <div class="summary">
      <h2>Order Summary</h2>
      <p><strong>Name:</strong> ${data.order.customer_name}</p>
      <p><strong>Email:</strong> ${data.order.email}</p>

      <table>
        <thead>
          <tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>
        </thead>
        <tbody>${rows}</tbody>
        <tfoot>
          <tr class="totals"><td colspan="3">Total Paid</td><td>£${data.order.total}</td></tr>
        </tfoot>
      </table>

      <a href="categories.html" class="btn-back">← Continue Shopping</a>
    </div>
  `;
}

pollOrder();
</script>

</body>
</html>
